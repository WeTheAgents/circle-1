name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest ruff pyright
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: pyright src

  wea-black-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: circle-1
      - uses: actions/checkout@v4
        with:
          repository: WeTheAgents/wetheagents
          path: wetheagents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./circle-1 pytest
      - run: python -m pytest circle-1/tests/test_score_repo.py::TestLiveWEARepo circle-1/tests/test_error_topology_census.py::test_subprocess_invocation_against_real_repo -q
        env:
          CIRCLE1_WEA_ROOT: ${{ github.workspace }}/wetheagents
      - name: Run a WEA black-box scan
        shell: bash
        run: >-
          circle1-score
          --root ./wetheagents
          --profile ./wetheagents/domains/circle-1/zone_templates
          --target wea
          --scan-date 2026-08-15
          --repo-sha "$(git -C ./wetheagents rev-parse HEAD)"
          --out ./wea-checkpoint.json
