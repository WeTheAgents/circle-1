[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circle1"
version = "0.1.0"
description = "Repository cooling metrics and scanners for agent-maintained codebases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
circle1-score = "circle1.score_repo:main"
circle1-scripts = "circle1.scripts_inventory:main"
circle1-task-contracts = "circle1.task_contract_extractor:main"
circle1-observability = "circle1.observability_inventory:main"
circle1-error-topology = "circle1.error_topology_census:main"
circle1-crap-risk = "circle1.crap_risk_harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]
